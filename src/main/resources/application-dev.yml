spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pix_transfer_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false
  
  sql:
    init:
      mode: always
      continue-on-error: true

server:
  port: 8080
